name: Build README and deploy Datasette

on:
  push:
    branches:
    - main

permissions:
  contents: write

env:
  # Cloudflare R2, reached through its S3-compatible API
  S3_BUCKET: til
  S3_ENDPOINT_URL: https://67eab20473109e6b27c94a74f4a31dbe.r2.cloudflarestorage.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v3
      # We need full history to introspect created/updated:
      with:
        fetch-depth: 0
        path: main
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    - uses: actions/cache@v3
      name: Configure pip caching
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache Playwright browsers
      uses: actions/cache@v3
      with:
        path: ~/.cache/ms-playwright/
        key: ${{ runner.os }}-browsers
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r main/requirements.txt
    - name: Install Playwright dependencies
      run: |
        shot-scraper install
    - name: Download previous database unless REBUILD in commit message
      if: |-
        !contains(github.event.head_commit.message, 'REBUILD')
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |-
        s3-credentials get-object "$S3_BUCKET" tils.db -o main/tils.db \
          --endpoint-url "$S3_ENDPOINT_URL"
      continue-on-error: true
    - name: Build database
      env:
        MARKDOWN_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        cd main
        python build_database.py
    - name: Soundness check
      run: |-
        cd main
        datasette . --get / | grep "Jack: TIL"
    - name: Generate missing screenshots
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |-
        cd main
        python generate_screenshots.py
        sqlite-utils vacuum tils.db
    - name: Calculate embeddings and document similarity
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENROUTER_HTTP_REFERER: https://til.jiaqicai.com/
        OPENROUTER_APP_NAME: Jack's TIL related content
      run: |-
        cd main
        python .agents/skills/openrouter-til-embeddings/scripts/generate_embeddings.py tils.db
        openai-to-sqlite similar tils.db --all --save
    - name: Verify embeddings and similarities
      run: |-
        cd main
        python - <<'PY'
        import sqlite3

        conn = sqlite3.connect("tils.db")
        tables = {
            row[0]
            for row in conn.execute(
                "select name from sqlite_master where type = 'table'"
            )
        }
        assert "embeddings" in tables, "embeddings table is missing"
        assert "similarities" in tables, "similarities table is missing"
        til_count = conn.execute("select count(*) from til").fetchone()[0]
        embedding_count = conn.execute(
            "select count(*) from embeddings"
        ).fetchone()[0]
        similarity_count = conn.execute(
            "select count(*) from similarities"
        ).fetchone()[0]
        assert embedding_count == til_count, (embedding_count, til_count)
        assert similarity_count > 0, "similarities table is empty"
        print(
            f"Verified {embedding_count} embeddings and "
            f"{similarity_count} similarities"
        )
        PY
    - name: Update README
      run: |-
        cd main
        python update_readme.py --rewrite
        cat README.md
    - name: Commit and push if README changed
      run: |-
        cd main
        git diff -- README.md
        if ! git diff --quiet -- README.md; then
          git config --global user.email "actions@users.noreply.github.com"
          git config --global user.name "README-bot"
          git add README.md
          git commit -m "Updated README"
          git push
        fi
    - name: Upload latest tils.db to the R2 bucket
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |-
        s3-credentials put-object "$S3_BUCKET" tils.db main/tils.db \
          --endpoint-url "$S3_ENDPOINT_URL"
    - name: Install Fly
      run: |
        curl -L https://fly.io/install.sh | sh
    - name: Deploy Datasette using Fly
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: |-
        cd main
        PATH=$PATH:/home/runner/.fly/bin/ datasette publish fly tils.db \
          --app jack-tils \
          --metadata metadata.yaml \
          --static static:static \
          --install datasette-template-sql \
          --install "datasette-sitemap>=1.0" \
          --install "datasette-atom>=0.7" \
          --install datasette-json-html \
          --install beautifulsoup4 \
          --install "datasette-debug-asgi>=1.1" \
          --install "datasette-graphql>=2.2" \
          --install datasette-block-robots \
          --install datasette-llm-embed \
          --install datasette-sqlite-vec \
          --install datasette-os-info \
          --plugins-dir plugins \
          --template-dir templates \
          --setting allow_facet off
